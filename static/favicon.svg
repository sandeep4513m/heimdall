<svg width="512" height="512" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="28" height="28" fill="#07090d"/>
  <!-- Outer diamond -->
  <polygon points="14,2 26,14 14,26 2,14"
    fill="none" stroke="#c8a96e" stroke-width="0.8" opacity="0.4"/>
  <!-- Inner diamond -->
  <polygon points="14,5 23,14 14,23 5,14"
    fill="none" stroke="#c8a96e" stroke-width="0.6" opacity="0.6"/>
  <!-- Outer ring -->
  <ellipse cx="14" cy="14" rx="5" ry="5"
    fill="none" stroke="#c8a96e" stroke-width="1"/>
  <!-- Center dot -->
  <ellipse cx="14" cy="14" rx="2" ry="2"
    fill="#c8a96e"/>
  <!-- Cardinal lines -->
  <line x1="14" y1="2"  x2="14" y2="7"  stroke="#c8a96e" stroke-width="1" opacity="0.8"/>
  <line x1="14" y1="21" x2="14" y2="26" stroke="#c8a96e" stroke-width="1" opacity="0.8"/>
  <line x1="2"  y1="14" x2="7"  y2="14" stroke="#c8a96e" stroke-width="1" opacity="0.8"/>
  <line x1="21" y1="14" x2="26" y2="14" stroke="#c8a96e" stroke-width="1" opacity="0.8"/>
</svg>
